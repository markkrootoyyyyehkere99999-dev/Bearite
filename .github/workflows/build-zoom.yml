name: Build SBA Chess

on:
  workflow_dispatch:
  push:
    paths:
      - "sdk/mods/sba-chess/**"
      - ".github/workflows/build-zoom.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Собрать .so
        run: |
          cmake -S sdk/mods/sba-chess -B build-chess \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-chess

      - name: Собрать папку мода и упаковать в zip
        run: |
          mkdir -p out/libs/arm64-v8a
          cp sdk/mods/sba-chess/mod.json out/
          if [ -f sdk/mods/sba-chess/icon.png ]; then cp sdk/mods/sba-chess/icon.png out/; fi
          cp build-chess/libsbachess.so out/libs/arm64-v8a/
          cd out
          zip -r ../sba-chess.zip .

      - name: Выложить результат
        uses: actions/upload-artifact@v4
        with:
          name: sba-chess
          path: sba-chess.zip
